# Build and deploy MERIDIAN Data Analyst Template to GitHub Pages
#
# This workflow runs on the PUBLIC repo (demoanalytics) only.
# It builds a static export and deploys to GitHub Pages.
#
# The private repo (dataanalysistemplate) does NOT use this workflow —
# it runs the full Next.js server with API routes locally.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # The base path will be /<repo-name>/ for project sites
          # configure-pages auto-detects this from the repo name
          enablement: true

      - name: Build static export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: '1'
          # NEXT_PUBLIC_BASE_PATH is set by configure-pages to /<repo-name>
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
